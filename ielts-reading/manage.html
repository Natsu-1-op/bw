<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>词库管理 · 雅思阅读</title><link rel="stylesheet" href="style.css"><style>
.manage{max-width:760px;margin:28px auto 80px}.manage h1{margin:8px 0 20px}.manage-card{background:white;border:1px solid #dce4ef;border-radius:10px;padding:20px;margin:16px 0}.manage label{display:block;font-size:14px;font-weight:600;margin:14px 0 5px}.manage input,.manage textarea,.manage select{width:100%;box-sizing:border-box;border:1px solid #cbd6e5;border-radius:7px;padding:10px;font:inherit;background:white}.manage textarea{min-height:75px;resize:vertical}.manage .inline{display:flex;gap:10px;align-items:end}.manage .inline>div{flex:1}.manage button{padding:10px 16px;border-radius:7px}.manage .help{font-size:13px;color:#64748b;line-height:1.6}.manage .status{min-height:1.5em;color:#255a9a}.manage .actions{position:static;display:flex;gap:10px;margin-top:18px}@media(max-width:600px){.manage{margin:16px auto 40px}.manage-card{padding:16px}.manage .inline{display:block}}
</style></head><body><header><div class="wrap brand"><a class="brand-name" href="./"><span class="mark">读</span>雅思阅读</a><a class="home-link" href="./">返回复习 ↗</a></div></header><main class="wrap manage"><div class="eyebrow">WORD LIBRARY</div><h1>管理词库</h1><p class="help">选择已有表达修改，或添加新表达。保存后直接更新云端，复习页刷新即可看到；已有熟练度按词条 ID 保留。</p><div class="manage-card"><label for="choose">选择词条</label><select id="choose"><option value="">＋ 添加新词条</option></select><label for="search">搜索已有词条</label><input id="search" type="search" placeholder="输入表达或套题名称"><p class="status" id="status" role="status">正在连接词库…</p></div><form id="form" class="manage-card"><div class="inline"><div><label for="book">套题</label><input id="book" required placeholder="例如 C14T4"></div><div><label for="term">表达</label><input id="term" required placeholder="例如 interrogate"></div></div><p class="help" id="idHelp">新词条的 ID 由套题和表达生成。</p><label for="meaning">文中含义</label><input id="meaning" required><label for="source">出处</label><input id="source" required placeholder="例如 C14T4 · Passage 3 第 13 自然段"><label for="sentence">完整原句</label><textarea id="sentence" required></textarea><label for="target">原句中的对应形式</label><input id="target" required><label for="translation">原句翻译</label><textarea id="translation" required></textarea><div class="inline"><div><label for="page">PDF 页码（可选）</label><input id="page" type="number" min="1"></div></div><label for="extMeaning">拓展含义或搭配</label><input id="extMeaning" required><label for="extExample">拓展示例（教师自拟）</label><textarea id="extExample" required></textarea><label for="extTranslation">例句翻译</label><textarea id="extTranslation" required></textarea><label for="note">用法提醒（可选）</label><textarea id="note"></textarea><div class="actions"><button type="submit" class="primary" id="save" disabled>保存到词库</button><button type="button" id="reset">清空 / 新增</button></div></form></main><script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script src="manage.js"></script></body></html>
