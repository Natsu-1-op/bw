<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雅思写作 · 复习</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap brand"><a class="brand-name" href="../"><span class="mark">W</span> IELTS Writing</a><a class="home-link" href="../ielts-reading/">阅读复习</a></div></header><main class="wrap"><section class="intro"><div><div class="eyebrow">WRITING PRACTICE</div><h1>写作<span>复习</span></h1><p class="sub">回忆表达，再用自己的话写出来。</p></div><span id="cloudStatus" class="cloud-state">连接中</span></section><div class="selectors"><label>练习分组<select id="group"><option value="">全部写作</option></select></label><label>题型<select id="mode"><option value="mixed">混合练习</option><option value="recall">中文回忆英文</option><option value="blank">原句填空</option></select></label><label>每次词数<input id="limit" type="number" min="1" max="50" value="10"></label></div><p id="notice" class="notice" aria-live="polite"></p><p><button id="start" class="primary">开始复习</button> <button id="cloudRetry">重新同步</button></p><section id="card" class="card hidden"><div id="tag" class="tag"></div><div id="prompt" class="prompt"></div><textarea id="input" placeholder="先尝试输入英文，再揭晓答案"></textarea><p><button id="reveal" class="primary">查看答案</button></p><div id="answer" class="answer hidden"><strong id="term"></strong><p id="sentence" class="sentence"></p><p id="translation"></p><p id="note" class="sub"></p><div class="actions"><button data-rate="again">忘记了</button> <button data-rate="hard">模糊</button> <button data-rate="good">独立想起</button></div></div></section><section id="finish" class="card hidden"><h2>本次练习完成</h2><p>选一个新观点，写观点、理由和一个具体结果。检查第二句解释了什么，第三句怎样接上。</p><div id="transfer"></div><div id="summary"></div></section><details class="reference"><summary>备份与恢复</summary><button id="export">导出 JSON</button> <label>导入 JSON <input type="file" id="import" accept="application/json"></label></details></main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="firebase-config.js"></script><script src="sync-core.js"></script><script src="cloud-sync.js"></script><script src="app.js"></script></body></html>
