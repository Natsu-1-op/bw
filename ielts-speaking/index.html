<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>雅思口语 · 一天一点</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="fflate.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="wrap brand">
    <a class="brand-name" href="./"><span class="mark" aria-hidden="true">说</span>雅思口语</a>
    <nav aria-label="雅思练习"><a href="../ielts/">雅思总览</a></nav>
  </header>
  <main class="wrap">
    <h1>一天一点</h1>
    <section class="card" aria-label="口语跟读">
      <div class="selectors">
        <label for="days">课程
          <select id="days" disabled><option>正在读取课程…</option></select>
        </label>
        <label for="tracks" id="track-field" hidden>音轨
          <select id="tracks"></select>
        </label>
      </div>
      <p id="course-status" class="sub" role="status"></p>
      <div id="lesson" hidden>
        <div id="playback">
          <audio controls preload="metadata" aria-label="课程音频"></audio>
          <div class="row playback-actions">
            <button id="back" type="button">回退 5 秒</button>
            <label class="check"><input id="loop" type="checkbox"> 循环播放</label>
          </div>
        </div>
        <details id="notes" class="reference">
          <summary>查看讲义</summary>
          <div class="row notes-actions">
            <label for="docs" id="doc-field">讲义版本<select id="docs"></select></label>
            <a class="button" id="open" target="_blank" rel="noopener" hidden>打开 PDF</a>
          </div>
          <div id="pdf-viewer" hidden>
            <div class="pdf-toolbar" aria-label="讲义翻页">
              <button id="pdf-prev" type="button">上一页</button>
              <output id="pdf-page" aria-live="polite"></output>
              <button id="pdf-next" type="button">下一页</button>
            </div>
            <div id="pdf-surface"></div>
          </div>
          <p id="pdf-status" class="sub" role="status"></p>
        </details>
      </div>
    </section>
    <details id="management" class="reference management">
      <summary>课程管理</summary>
      <div class="card management-card">
        <form id="connect">
          <label for="token">GitHub 只读令牌</label>
          <div class="row">
            <input id="token" type="password" autocomplete="off" spellcheck="false" required>
            <button class="primary">连接课程库</button>
          </div>
          <p class="sub">令牌保留在当前标签页。打开过的课程可以离线练习。</p>
          <details class="reference token-help">
            <summary>如何创建令牌</summary>
            <p class="sub">仅选 <code>ielts-speaking-materials</code> 仓库，权限设为 <code>Contents: Read-only</code>。</p>
            <p><a href="https://github.com/settings/personal-access-tokens/new?name=IELTS+Speaking&amp;target_name=Natsu-1-op&amp;contents=read" target="_blank" rel="noopener">创建 GitHub 令牌</a></p>
          </details>
        </form>
        <div class="row" id="connected" hidden>
          <span>已连接 GitHub</span>
          <button type="button" id="disconnect">断开连接</button>
        </div>
        <p id="remote-status" class="sub" role="status"></p>
        <details class="reference">
          <summary>从本机导入</summary>
          <div class="row">
            <button id="pick" type="button">选择 ZIP、MP3 或 PDF</button>
            <button id="folder" type="button">选择文件夹</button>
          </div>
          <input hidden id="files" type="file" multiple accept=".zip,.mp3,.pdf">
          <input hidden id="folders" type="file" multiple webkitdirectory>
          <p id="msg" class="sub" role="status"></p>
        </details>
      </div>
    </details>
  </main>
</body>
</html>
