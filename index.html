unit.onchange=()=>{updateSections();render()};section.onchange=render;let searchTimer;search.oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(render,120)};$('#playAll').onclick=()=>{if(shown.length)play(shown[0])};$('#favorites').onclick=()=>{favoriteOnly=!favoriteOnly;$('#favorites').setAttribute('aria-pressed',favoriteOnly);$('#favorites').classList.toggle('active',favoriteOnly);render()};$('#prev').onclick=()=>step(-1);$('#togglePlayback').onclick=()=>{if(current&&!audio.paused)audio.pause();else if(current)play(current);else if(shown.length)play(shown[0])};$('#compactPlayer').onclick=()=>{const compact=$('.player').classList.toggle('compact');$('#compactPlayer').setAttribute('aria-expanded',!compact);$('#compactPlayer').setAttribute('aria-label',compact?'展开播放器':'收起播放器');$('#compactPlayer').title=compact?'展开播放器':'收起播放器';$('#compactPlayer').textContent=compact?'⌃':'⌄';updatePlayerSpace()};$('#next').onclick=()=>step(1);$('#speed').value=String(read('cantonese-audio-speed',1));if(!$('#speed').value)$('#speed').value='1';$('#speed').onchange=()=>{audio.playbackRate=Number($('#speed').value);write('cantonese-audio-speed',audio.playbackRate)};$('#repeat').onchange=()=>audio.loop=$('#repeat').checked;
for(const [id,cls]of[['showMeaning','hide-meaning'],['showRoman','hide-roman']])$(('#'+id)).onchange=e=>document.body.classList.toggle(cls,!e.target.checked);
audio.onplay=setPlayState;audio.onpause=()=>{setPlayState();persist()};audio.onended=()=>{if($('#auto').checked&&!audio.loop)step(1);else setPlayState()};audio.onerror=()=>$('#status').textContent='无法读取这条录音，请检查音频文件是否完整上传。';audio.ontimeupdate=()=>{if(Date.now()-lastPersist>4000){persist();lastPersist=Date.now()}};window.addEventListener('pagehide',persist);if('mediaSession'in navigator){for(const [action,handler]of[['play',()=>current&&play(current)],['pause',()=>audio.pause()],['previoustrack',()=>step(-1)],['nexttrack',()=>step(1)]]){try{navigator.mediaSession.setActionHandler(action,handler)}catch{}}}
function updatePlayerSpace(){document.documentElement.style.setProperty('--player-height',$('.player').getBoundingClientRect().height+'px')}if('ResizeObserver'in window)new ResizeObserver(updatePlayerSpace).observe($('.player'));window.addEventListener('resize',updatePlayerSpace);updatePlayerSpace();
if(resume){current=resume;audio.src=resume.file;describe(resume);audio.addEventListener('loadedmetadata',()=>{if(last.time&&last.time<audio.duration)audio.currentTime=last.time;audio.playbackRate=Number($('#speed').value)},{once:true})}updateSections();render();
